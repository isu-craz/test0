<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">

    <!-- The Glass/White Card Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-10 overflow-hidden relative">
        
        <!-- Subtle background glow effect -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-600/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl"></div>

        <div class="relative z-10">
            <!-- Header Text -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">Welcome Back</h1>
                <p class="text-slate-500 font-medium">Please sign in to your restaurant account.</p>
            </div>

            <!-- The Form -->
            <!-- In Spring Boot, Member 1 will change this to: <form th:action="@{/login}" method="post"> -->
            <form action="#" method="POST" class="space-y-6">
                
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition-all duration-200" required>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                        <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition-all duration-200" required>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/20 transform hover:-translate-y-0.5 transition-all duration-200">
                    Sign In to Portal
                </button>
            </form>

            <!-- Bottom Links -->
            <div class="mt-8 text-center border-t border-slate-100 pt-6">
                <p class="text-slate-500 text-sm font-medium">New around here? 
                    <!-- In Spring Boot, Member 1 will change this to <a href="/users/add"> -->
                    <a href="#" class="text-indigo-600 font-bold hover:text-indigo-800 transition-colors ml-1">Create an Account</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
