<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | Book a Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center py-12">

    <!-- Navbar -->
    <nav class="w-full max-w-5xl bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between px-8 py-4 mb-10">
        <h1 class="text-2xl font-bold tracking-tight text-slate-800">Grand <span class="text-indigo-600">Restaurant</span></h1>
        <div class="flex gap-6 text-sm font-semibold text-slate-500">
            <a href="#" class="hover:text-indigo-600 transition">Menu</a>
            <a href="#" class="text-indigo-600">Reservations</a>
            <a href="#" class="hover:text-indigo-600 transition">Reviews</a>
            <div class="h-5 w-px bg-slate-200"></div>
            <a href="#" class="hover:text-indigo-600 transition">John Doe</a>
        </div>
    </nav>

    <!-- Main Booking Engine -->
    <main class="w-full max-w-4xl bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left: Date Selection -->
        <div class="w-full md:w-1/2 p-10 bg-slate-50 border-r border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Select a Date</h2>
            
            <!-- Custom Date Input -->
            <!-- In Spring Boot, Member 4 will bind this using th:field="*{bookingDate}" -->
            <div class="mb-8">
                <input type="date" class="w-full bg-white border border-slate-200 text-slate-800 font-semibold rounded-xl p-4 shadow-sm outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20" value="2024-09-20">
            </div>

            <!-- Calendar Display (Visual Demo only) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                <div class="flex justify-between items-center mb-6">
                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold hover:bg-slate-200">&lt;</button>
                    <span class="font-bold text-slate-800">September 2024</span>
                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold hover:bg-slate-200">&gt;</button>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 mb-4 uppercase">
                    <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center font-semibold text-sm">
                    <!-- Fake Calendar Days -->
                    <div class="text-slate-300 py-2">29</div>
                    <div class="text-slate-300 py-2">30</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">1</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">2</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">3</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">4</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">5</div>
                    <!-- Selected Day -->
                    <div class="py-2 rounded-lg cursor-pointer col-start-5 bg-indigo-600 text-white shadow-md shadow-indigo-600/30">20</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">21</div>
                    <div class="py-2 hover:bg-slate-100 rounded-lg cursor-pointer">22</div>
                </div>
            </div>
        </div>

        <!-- Right: Time & Details Selection -->
        <div class="w-full md:w-1/2 p-10 bg-white">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Book Your Table</h2>

            <!-- Fake Form -->
            <form action="#" method="POST">
                
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide">Party Size</label>
                    <select class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 font-semibold text-slate-800 outline-none focus:border-indigo-600 appearance-none cursor-pointer">
                        <option>2 Guests</option>
                        <option selected>4 Guests</option>
                        <option>6 Guests</option>
                        <option>8+ Guests</option>
                    </select>
                </div>

                <div class="mb-10">
                    <label class="block text-sm font-semibold text-slate-500 mb-4 uppercase tracking-wide">Select Time Slot</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" class="py-3 px-4 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 font-semibold cursor-not-allowed">
                            6:00 PM <span class="block text-xs font-normal">Sold Out</span>
                        </button>
                        <button type="button" class="py-3 px-4 rounded-xl border border-slate-200 bg-white text-slate-800 font-bold hover:border-indigo-600 hover:text-indigo-600 shadow-sm transition-all">
                            7:00 PM
                        </button>
                        <!-- Selected Time Slot -->
                        <button type="button" class="py-3 px-4 rounded-xl bg-purple-600 border border-purple-700 text-white font-bold shadow-lg shadow-purple-600/30 transform scale-105 transition-all">
                            8:00 PM
                        </button>
                        <button type="button" class="py-3 px-4 rounded-xl border border-slate-200 bg-white text-slate-800 font-bold hover:border-indigo-600 hover:text-indigo-600 shadow-sm transition-all">
                            9:00 PM
                        </button>
                    </div>
                </div>

                <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl mb-6">
                    <p class="text-sm text-slate-600"><strong>Booking Summary:</strong> <br> Friday, Sep 20 at 8:00 PM for 4 Guests.</p>
                </div>

                <button type="submit" class="w-full py-4 text-center rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 shadow-xl shadow-indigo-600/20 transform hover:-translate-y-1 transition-all">
                    Confirm Reservation
                </button>

            </form>
        </div>

    </main>

</body>
</html>
