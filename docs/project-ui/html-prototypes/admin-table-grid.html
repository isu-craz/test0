<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | Table Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-bold text-indigo-600">Admin Console</h2>
            <div class="h-6 w-px bg-slate-200"></div>
            <h1 class="font-semibold text-slate-700">Table Mapping Grid</h1>
        </div>
        
        <!-- Action Buttons -->
        <!-- In Spring Boot, change this to <a th:href="@{/tables/add}"> -->
        <button class="bg-slate-900 hover:bg-black text-white px-4 py-2 rounded-lg font-semibold text-sm shadow-md transition-all">+ Add New Table</button>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Side: Table Property Editor -->
        <div class="w-80 bg-white border-r border-slate-200 p-6 overflow-y-auto flex flex-col gap-6">
            
            <div class="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl">
                <h3 class="font-bold text-indigo-900">Manage Table T-14</h3>
                <p class="text-xs text-slate-500 mt-1">Select a table on the right to edit its properties.</p>
            </div>

            <!-- Fake Edit Form -->
            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Table Number/Name</label>
                    <input type="text" value="T-14" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-600 font-semibold text-slate-900">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Assign Dining Zone</label>
                    <select class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-600 bg-white shadow-sm font-medium">
                        <!-- thymeleaf loop: <option th:each="zone : ${zones}"> -->
                        <option>Main Dining Hall</option>
                        <option selected>VIP Lounge</option>
                        <option>Patio</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Max Seat Capacity</label>
                    <input type="number" value="4" min="2" max="10" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-600 font-medium">
                </div>
                <div class="flex gap-2 pt-4 border-t border-slate-100">
                    <button type="button" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition">Save Table</button>
                    <button type="button" class="w-full bg-white text-red-600 border border-red-200 font-bold py-2 rounded-lg hover:bg-red-50 transition">Delete</button>
                </div>
            </form>

            <div class="mt-auto pt-6 border-t border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Table Legend</p>
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-4 h-4 rounded border-2 border-slate-300"></div> <span class="text-sm text-slate-600 font-medium">Standard 4-Seat Table</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-full border-2 border-slate-300"></div> <span class="text-sm text-slate-600 font-medium">Round 2-Seat Table</span>
                </div>
            </div>
        </div>

        <!-- Right Side: The Map Grid Visualization -->
        <!-- In your actual Spring Boot view, this can be heavily simplified. We are just giving a gorgeous visual demo! -->
        <div class="flex-1 bg-slate-100 p-8 overflow-y-auto relative">
            <div class="bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-200 p-10 min-h-[600px] bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0wIDAwaDYwdjYwSDBWMHptMCA2MGg2MFYwSDB2NjB6bTYwIDBIMFYwIiBzdHJva2U9IiM0NzU1NjkiIHN0cm9rZS1vcGFjaXR5PSIwLjA1IiBzdHJva2Utd2lkdGg9IjEiLz48L2c+PC9zdmc+')] relative">
                
                <h2 class="text-2xl font-bold text-slate-400 absolute top-8 left-8 opacity-50 uppercase tracking-widest">VIP Area Grid</h2>

                <!-- A Table Graphic (Square 4-seater) -->
                <!-- Use a Thymeleaf loop to dynamically print these divs across the screen if you want to get fancy! -->
                <div class="absolute top-32 left-32 w-24 h-24 bg-white border-2 border-slate-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 hover:shadow-lg transition-all transform hover:-translate-y-1 group">
                    <span class="font-bold text-slate-700 text-lg">T-12</span>
                    <span class="text-xs text-slate-400 font-semibold uppercase">4 Seats</span>
                    
                    <!-- Chairs -->
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-slate-200 border-2 border-slate-300 rounded-t-lg group-hover:border-indigo-300"></div>
                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-slate-200 border-2 border-slate-300 rounded-b-lg group-hover:border-indigo-300"></div>
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-l-lg group-hover:border-indigo-300"></div>
                    <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-r-lg group-hover:border-indigo-300"></div>
                </div>

                <!-- An Active Selected Table (Square 4-seater) -->
                <div class="absolute top-32 left-72 w-24 h-24 bg-indigo-600 border-2 border-indigo-700 shadow-xl shadow-indigo-600/30 rounded-xl flex flex-col items-center justify-center cursor-pointer scale-105 z-10 transition-all">
                    <span class="font-bold text-white text-lg drop-shadow-md">T-14</span>
                    <span class="text-xs text-indigo-200 font-semibold uppercase">4 Seats</span>
                    
                    <!-- Chairs -->
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-indigo-500 border-2 border-indigo-700 rounded-t-lg"></div>
                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-indigo-500 border-2 border-indigo-700 rounded-b-lg"></div>
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-indigo-500 border-2 border-indigo-700 rounded-l-lg"></div>
                    <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-indigo-500 border-2 border-indigo-700 rounded-r-lg"></div>
                </div>

                <!-- A Table Graphic (Round 2-seater) -->
                <div class="absolute top-72 left-32 w-20 h-20 bg-white border-2 border-slate-300 rounded-full flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 hover:shadow-lg transition-all transform hover:-translate-y-1 group">
                    <span class="font-bold text-slate-700">T-01</span>
                    <span class="text-[10px] text-slate-400 font-semibold uppercase">2 Seats</span>
                    
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-l-full group-hover:border-indigo-300"></div>
                    <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-r-full group-hover:border-indigo-300"></div>
                </div>

                <!-- A Table Graphic (Round 2-seater) -->
                <div class="absolute top-72 left-72 w-20 h-20 bg-white border-2 border-slate-300 rounded-full flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 hover:shadow-lg transition-all transform hover:-translate-y-1 group">
                    <span class="font-bold text-slate-700">T-02</span>
                    <span class="text-[10px] text-slate-400 font-semibold uppercase">2 Seats</span>
                    
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-l-full group-hover:border-indigo-300"></div>
                    <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-4 h-8 bg-slate-200 border-2 border-slate-300 rounded-r-full group-hover:border-indigo-300"></div>
                </div>

            </div>
        </div>

    </main>
</body>
</html>
